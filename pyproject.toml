[project]
name = "convergence-rig"
version = "0.1.0"
description = "A local CDC test rig for exact row convergence under disruption"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "duckdb>=1.2",
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "pytz>=2026.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
