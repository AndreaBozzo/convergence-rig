tables:
  - name: public.orders

source:
  mode: logical
  postgres_url: "postgres://${PG_SOURCE_USER}:${PG_SOURCE_PASSWORD}@pg-source:5432/${PG_SOURCE_DB}?sslmode=disable"
  logical:
    publication_name: pg2iceberg_pub
    slot_name: pg2iceberg_slot

sink:
  catalog_uri: "http://lakekeeper:8181/catalog"
  catalog_auth: none
  credential_mode: vended
  warehouse: "${LAKEKEEPER_WAREHOUSE}"
  namespace: "${LAKEKEEPER_NAMESPACE}"
  s3_region: "${SILO_REGION}"
  flush_interval: 2s
  flush_rows: 1000
  materializer_batch_rows: 10000
  materializer_interval: 10s
  # C1: enable automatic compaction beside the materializer.
  # Upstream 0.12.0 defaults: target_file_size=134217728 (128 MiB),
  # compaction_data_files=8, compaction_delete_files=32, compaction_delete_ratio=0.1.
  # Thresholds lowered so both small-file and equality-delete compaction run
  # inside a 180 s window at 10 ops/s on the 250,000-row fixture (~17 cycles).
  target_file_size: 134217728
  compaction_data_files: 4
  compaction_delete_files: 6
  compaction_delete_ratio: 0.1
  maintenance: pg2iceberg

state:
  coordinator_schema: _pg2iceberg

metrics_addr: ":9090"
