name: p2irepro

# Minimal stack for reproducing pg2iceberg 0.12.0's fatal exit during a transient
# Iceberg REST catalog outage.
# All images are pinned by multi-arch manifest index digest (linux/amd64 + linux/arm64).
# All published ports are bound to 127.0.0.1 and use synthetic local-only credentials.

services:
  pg-source:
    image: postgres:17-bookworm@sha256:837bed18782820fe967067cb5328b02b0d9992c1be9a37ee0c9c492cfc03af3b
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: repro_pg_pass
      POSTGRES_DB: repro
    command:
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=8
      - -c
      - max_wal_senders=8
    ports:
      - "127.0.0.1:${P2I_PG_PORT:-25432}:5432"
    volumes:
      - pg_source_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d repro"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - p2irepro_net

  lakekeeper-db:
    image: postgres:17-bookworm@sha256:837bed18782820fe967067cb5328b02b0d9992c1be9a37ee0c9c492cfc03af3b
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: repro_lk_pass
      POSTGRES_DB: lakekeeper
    volumes:
      - lakekeeper_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lakekeeper"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - p2irepro_net

  silo:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z@sha256:b616a0cf8cb281e7e6bb3c9b1fb53875b4016a2878223925541c18f82d6c5ca3
    command:
      - server
      - /data
      - --address
      - ":9000"
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: repro-silo-user
      MINIO_ROOT_PASSWORD: repro-silo-pass
      MINIO_REGION_NAME: local-01
    ports:
      - "127.0.0.1:${P2I_SILO_PORT:-29000}:9000"
    volumes:
      - silo_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc alias set health http://127.0.0.1:9000 repro-silo-user repro-silo-pass >/dev/null 2>&1 && mc ready health >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - p2irepro_net

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.15.1@sha256:22dcb6044c106a962c242b70051bd226bd50c9134c763121d8713c37fe9a70ec
    command: ["migrate"]
    restart: "no"
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: repro-synthetic-encryption-key-not-for-prod
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://postgres:repro_lk_pass@lakekeeper-db:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://postgres:repro_lk_pass@lakekeeper-db:5432/lakekeeper
      RUST_LOG: info
    depends_on:
      lakekeeper-db:
        condition: service_healthy
    networks:
      - p2irepro_net

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.15.1@sha256:22dcb6044c106a962c242b70051bd226bd50c9134c763121d8713c37fe9a70ec
    command: ["serve"]
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: repro-synthetic-encryption-key-not-for-prod
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://postgres:repro_lk_pass@lakekeeper-db:5432/lakekeeper
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://postgres:repro_lk_pass@lakekeeper-db:5432/lakekeeper
      RUST_LOG: info
    ports:
      - "127.0.0.1:${P2I_LAKEKEEPER_PORT:-28181}:8181"
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      lakekeeper-db:
        condition: service_healthy
      silo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 2s
      timeout: 10s
      retries: 20
      start_period: 3s
    networks:
      - p2irepro_net

  pg2iceberg:
    image: polynyadev/pg2iceberg:0.12.0@sha256:c6b97dc3e4d1e41deee3bcd84c1dc8c655c24b0bbc2061a087afc27b242a7916
    profiles: ["single"]
    command: ["run", "--config", "/etc/pg2iceberg/config.yaml"]
    restart: "no"
    environment:
      PG2ICEBERG_LOG_FORMAT: json
    volumes:
      - ./pg2iceberg.yaml:/etc/pg2iceberg/config.yaml:ro
    depends_on:
      pg-source:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy
      silo:
        condition: service_healthy
    networks:
      - p2irepro_net

  pg2iceberg-stream:
    image: polynyadev/pg2iceberg:0.12.0@sha256:c6b97dc3e4d1e41deee3bcd84c1dc8c655c24b0bbc2061a087afc27b242a7916
    profiles: ["split"]
    command: ["stream-only", "--config", "/etc/pg2iceberg/config.yaml"]
    restart: "no"
    environment:
      PG2ICEBERG_LOG_FORMAT: json
    volumes:
      - ./pg2iceberg.yaml:/etc/pg2iceberg/config.yaml:ro
    depends_on:
      pg-source:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy
      silo:
        condition: service_healthy
    networks:
      - p2irepro_net

  pg2iceberg-materializer:
    image: polynyadev/pg2iceberg:0.12.0@sha256:c6b97dc3e4d1e41deee3bcd84c1dc8c655c24b0bbc2061a087afc27b242a7916
    profiles: ["split"]
    command: ["materializer-only", "--config", "/etc/pg2iceberg/config.yaml", "--worker-id", "worker-1"]
    restart: "no"
    environment:
      PG2ICEBERG_LOG_FORMAT: json
    volumes:
      - ./pg2iceberg.yaml:/etc/pg2iceberg/config.yaml:ro
    depends_on:
      pg-source:
        condition: service_healthy
      lakekeeper:
        condition: service_healthy
      silo:
        condition: service_healthy
    networks:
      - p2irepro_net

volumes:
  pg_source_data:
  lakekeeper_db_data:
  silo_data:

networks:
  p2irepro_net:
